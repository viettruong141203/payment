<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trạm Đồng Bộ Giao Dịch AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0A0F1C; color: #FFFFFF;
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; justify-content: center;
    }
    
    /* Nền ma trận */
    body::before {
      content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px; z-index: -1; pointer-events: none;
    }

    .dashboard {
      width: 100%; max-width: 650px;
      background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 24px; padding: 30px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.1);
    }
    
    .header { text-align: center; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 20px; margin-bottom: 25px; }
    .header h2 { margin: 0; color: #00E5FF; font-size: 24px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 0 15px rgba(0,229,255,0.5); }
    .header p { font-size: 13px; color: #94A3B8; margin: 8px 0 0; }
    
    .status-panel { display: flex; gap: 15px; margin-bottom: 25px; }
    .stat-box {
      background: rgba(0,0,0,0.5); padding: 20px; border-radius: 16px;
      text-align: center; flex: 1; border: 1px solid rgba(255,255,255,0.05);
    }
    .stat-box span { display: block; font-size: 13px; color: #94A3B8; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;}
    .stat-box strong { font-size: 32px; font-weight: 800; }
    #pending-count { color: #FFC107; text-shadow: 0 0 15px rgba(255, 193, 7, 0.4); }
    #matched-count { color: #00E676; text-shadow: 0 0 15px rgba(0, 230, 118, 0.4); }

    .log-container {
      background: #000; border-radius: 16px; padding: 20px;
      height: 350px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 13px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }
    .log-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dotted #333; line-height: 1.5; word-break: break-all; }
    .log-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .log-time { color: #64748B; font-weight: bold; }
    .log-success { color: #00E676; font-weight: bold; }
    .log-info { color: #00E5FF; }
    .log-err { color: #FF1744; }
    
    button {
      width: 100%; padding: 18px; background: linear-gradient(135deg, #00E5FF, #0088FF); color: #000;
      border: none; border-radius: 16px; font-weight: 800; font-size: 16px; letter-spacing: 1px;
      cursor: pointer; margin-top: 25px; transition: all 0.2s; box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }
    button:active { transform: scale(0.98); box-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }
    button.scanning { background: linear-gradient(135deg, #FF1744, #B91C1C); color: #FFF; box-shadow: 0 0 20px rgba(255, 23, 68, 0.4); }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="header">
      <h2>TRẠM KIỂM DUYỆT GIAO DỊCH</h2>
      <p>Hệ thống hoạt động ngầm (Tự động quét mỗi 5 giây)</p>
    </div>

    <div class="status-panel">
      <div class="stat-box">
        <span>Đơn Đang Chờ</span>
        <strong id="pending-count">0</strong>
      </div>
      <div class="stat-box">
        <span>Khớp Thành Công</span>
        <strong id="matched-count">0</strong>
      </div>
    </div>

    <div class="log-container" id="log-box">
      <div class="log-entry log-info">🚀 Hệ thống đã sẵn sàng. Bấm nút bên dưới để khởi động luồng quét ngầm...</div>
    </div>

    <button id="btn-toggle" onclick="toggleScanner()">KHỞI ĐỘNG QUÉT TỰ ĐỘNG</button>
  </div>

  <script>
    // ==========================================
    // 🔧 CẤU HÌNH CÁC ĐƯỜNG DẪN API
    // ==========================================
    const SHEET_ORDERS_API = "https://script.google.com/macros/s/AKfycbzOxkqvXRnuzC-Ek8AUlutoAm7jsSgAYG-lGi8g0kxoV4UZ7FSIf7lCePQw3334ltubqw/exec";
    const BANK_FEED_API = "https://script.google.com/macros/s/AKfycbyTwyaKpLIydE7u0sosrDOPVCj2VG0xCq1r2Hwda8U6sQ7s7AXNAEIjwNiBnr2zVrJ2/exec";
    const UPDATE_WEBHOOK = "https://script.google.com/macros/s/AKfycbyIKlSp4SuJPWsLd09rnvIMIdL8BKa9b2E2FRHVAmdWQ0t2a40M4GDzsFWCzT5He14u/exec";
    
    let isScanning = false;
    let scanInterval;
    let matchCount = 0;

    // Hàm in nhật ký (Log) ra màn hình
    function addLog(msg, type = 'info') {
      const box = document.getElementById('log-box');
      const time = new Date().toLocaleTimeString();
      let colorClass = 'log-info';
      if (type === 'success') colorClass = 'log-success';
      if (type === 'err') colorClass = 'log-err';
      
      box.innerHTML = `<div class="log-entry"><span class="log-time">[${time}]</span> <span class="${colorClass}">${msg}</span></div>` + box.innerHTML;
    }

    // Điều khiển nút Bật/Tắt
    function toggleScanner() {
      const btn = document.getElementById('btn-toggle');
      if (isScanning) {
        clearInterval(scanInterval);
        isScanning = false;
        btn.innerText = "KHỞI ĐỘNG QUÉT TỰ ĐỘNG";
        btn.classList.remove('scanning');
        addLog("🛑 Đã tạm dừng hệ thống.");
      } else {
        isScanning = true;
        btn.innerText = "ĐANG QUÉT NGẦM... (BẤM ĐỂ DỪNG)";
        btn.classList.add('scanning');
        addLog("⚡ Tiến trình quét đã được khởi động...");
        runSync(); 
        scanInterval = setInterval(runSync, 5000); 
      }
    }

    // Thuật toán đối chiếu và bắn dữ liệu
    async function runSync() {
      try {
        // 1. Kéo danh sách đơn hàng từ Google Sheet
        let ordersRes = await fetch(SHEET_ORDERS_API + "?t=" + new Date().getTime(), { cache: "no-store" });
        let ordersJson = await ordersRes.json();
        
        // Kiểm tra cấu trúc data dựa trên ảnh bạn gửi (chứa mảng bên trong object data)
        let orders = ordersJson.data || ordersJson || [];

        // Lọc ra các đơn đang "Chờ thanh toán"
        let pendingOrders = orders.filter(o => {
            let status = o["Trạng thái"] ? String(o["Trạng thái"]).trim().toLowerCase() : "";
            return status === "chờ thanh toán";
        });
        
        document.getElementById('pending-count').innerText = pendingOrders.length;
        if (pendingOrders.length === 0) return; // Bỏ qua quét Bank nếu không có đơn chờ

        // 2. Kéo lịch sử giao dịch từ ngân hàng
        let bankRes = await fetch(BANK_FEED_API + "?t=" + new Date().getTime(), { cache: "no-store" });
        let bankJson = await bankRes.json();
        
        // Xử lý linh hoạt vì API BankFeed trả về mảng trực tiếp
        let transactions = Array.isArray(bankJson) ? bankJson : (bankJson.data || [bankJson]);

        // 3. Đối chiếu kép (Số tiền + Nội dung)
        for (let order of pendingOrders) {
            let orderId = String(order["Mã giao dịch"] || "").trim();
            let expAm = String(order["Số tiền"] || "").replace(/[^0-9]/g, "");
            let expCt = String(order["Nội dung"] || "").trim().toLowerCase();

            if (!expAm || !expCt || !orderId) continue;

            // Tìm một giao dịch trong BankFeed khớp hoàn toàn
            let matchedTx = transactions.find(tx => {
                let txAm = String(tx["Số tiền"] || "").replace(/[^0-9]/g, "");
                let txCt = String(tx["Nội dung"] || "").toLowerCase();
                return (txAm === expAm && txCt.includes(expCt));
            });

            // 4. Nếu tìm thấy khớp lệnh, gửi POST về Webhook
            if (matchedTx) {
                // Đóng gói JSON chuẩn đúng như yêu cầu
                let payload = {
                    "Thời gian": matchedTx["Thời gian"],
                    "Số tiền": matchedTx["Số tiền"],
                    "Nội dung": matchedTx["Nội dung"]
                };

                // Tính năng: "Thêm đuôi trên URL"
                // Gắn mã giao dịch vào đuôi URL để Webhook biết cần cập nhật cho ID nào
                let targetUrl = UPDATE_WEBHOOK + "?id=" + encodeURIComponent(orderId);

                // Bắn POST lên Google Apps Script
                fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                }).then(res => res.json())
                  .then(data => {
                    matchCount++;
                    document.getElementById('matched-count').innerText = matchCount;
                    addLog(`🔥 Khớp lệnh thành công: ID ${orderId} - ${payload["Số tiền"]} VNĐ`, 'success');
                }).catch(err => {
                    addLog(`Lỗi gửi Webhook cho ID ${orderId}: ` + err.message, 'err');
                });
            }
        }
      } catch (error) {
        addLog("Lỗi kết nối máy chủ: " + error.message, 'err');
      }
    }
  </script>
</body>
</html>
